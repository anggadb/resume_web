[project]
name = "resume-web"
version = "0.1.0"
description = "my personal project for integrate rag ai to assist my career record"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-generativeai>=0.8.6",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "mangum>=0.21.0",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.1",
    "uvicorn>=0.52.0",
]

[project.scripts]
resume-web = "resume_web:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
