[project]
name = "resume-web"
version = "0.1.0"
description = "my personal project for integrate rag ai to assist my career record"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "load-dotenv>=0.1.0",
    "mangum>=0.21.0",
    "pinecone>=9.1.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "uvicorn>=0.52.0",
]

[project.scripts]
resume-web = "resume_web:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
