<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume & AI Assistant</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi loading sederhana */
        .typing-indicator::after {
            content: '...';
            animation: typing 1.5s infinite steps(4, end);
        }
        @keyframes typing {
            0%, 100% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navbar -->
    <nav class="absolute w-full top-0 z-10 py-6 px-8 flex justify-between items-center text-white">
        <div class="text-2xl font-bold tracking-tighter">
            Angga Bachtiar
        </div>
        <div class="hidden md:flex gap-6 font-medium">
            <a href="#about" class="hover:text-blue-400 transition">About Me</a>
            <a href="#experience" class="hover:text-blue-400 transition">Career History</a>
            <a href="#contact" class="hover:text-blue-400 transition">Contact</a>
        </div>
    </nav>

    <!-- Header / Hero Section dengan AI Input -->
    <header class="relative bg-slate-900 min-h-screen flex flex-col items-center justify-center px-4 overflow-hidden">
        <!-- Dekorasi Background Latar Belakang -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black opacity-80"></div>
        <div class="absolute w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-3xl -top-20 -left-20"></div>
        <div class="absolute w-[400px] h-[400px] bg-purple-600/20 rounded-full blur-3xl bottom-10 -right-10"></div>

        <!-- Konten Hero -->
        <div class="relative z-10 text-center max-w-3xl mx-auto mt-16">
            <span class="text-blue-400 font-semibold tracking-wider uppercase text-sm mb-4 block">Software Engineer</span>
            <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 leading-tight">
                Convert <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Ideas to Codes</span>
            </h1>
            <p class="text-gray-400 text-lg mb-10">
                Feel free to ask my AI assistant anything related to my career or personal projects
            </p>

            <!-- AI Prompting Input -->
            <div class="w-full max-w-2xl mx-auto relative group">
                <form id="ai-form" class="relative flex items-center shadow-2xl shadow-blue-900/20">
                    <input 
                        type="text" 
                        id="ai-input" 
                        class="w-full bg-slate-800/80 border border-slate-700 text-white px-6 py-4 rounded-full outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all text-lg placeholder-slate-500 backdrop-blur-sm"
                        placeholder="What Angga's most complex project?"
                        required
                    >
                    <button 
                        type="submit" 
                        class="absolute right-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-2.5 rounded-full font-semibold hover:from-blue-600 hover:to-purple-700 transition-all flex items-center gap-2"
                    >
                        ASK
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </form>

                <!-- Box Hasil AI -->
                <div id="ai-response-box" class="hidden mt-6 bg-slate-800/90 border border-slate-700 rounded-2xl p-6 text-left backdrop-blur-md transition-all duration-300 transform translate-y-0">
                    <div class="flex items-start gap-4">
                        <div class="bg-blue-500/20 p-2 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-white font-medium mb-2">Angga:</h3>
                            <p id="ai-response-text" class="text-gray-300 leading-relaxed text-sm md:text-base">
                                <!-- Jawaban akan muncul di sini -->
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Script Integrasi -->
    <script>
        const aiForm = document.getElementById('ai-form');
        const aiInput = document.getElementById('ai-input');
        const responseBox = document.getElementById('ai-response-box');
        const responseText = document.getElementById('ai-response-text');

        aiForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const question = aiInput.value.trim();
            if (!question) return;

            // 1. Tampilkan box response dengan status loading
            responseBox.classList.remove('hidden');
            responseText.innerHTML = `<span class="text-gray-400 typing-indicator">Analyzing your input...</span>`;

            // 2. Simulasi Request ke Backend AI (Ganti dengan endpoint API asli Anda)
            try {
                /* 
                // UNCOMMENT KODE INI UNTUK INTEGRASI API ASLI:
                const response = await fetch('https://api.backend-anda.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: question })
                });
                const data = await response.json();
                responseText.innerHTML = data.answer;
                */

                // Simulasi delay jaringan (HAPUS INI JIKA MENGGUNAKAN API ASLI)
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Mock jawaban
                responseText.innerHTML = `Ini adalah simulasi jawaban AI untuk pertanyaan: <strong>"${question}"</strong>. <br><br> Pada tahap ini, Anda bisa menyambungkan endpoint backend (seperti Express.js atau FastAPI) yang terhubung ke model LLM (OpenAI, Gemini, dll) untuk merespon dengan pengalaman kerja atau portofolio Anda berdasarkan dokumen resume yang telah di-embed.`;

            } catch (error) {
                responseText.innerHTML = `<span class="text-red-400">Maaf, terjadi kesalahan saat menghubungi server AI.</span>`;
            }
        });
    </script>
</body>
</html>
